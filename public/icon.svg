<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e67" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="mint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <!-- Glowing radar circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4" />
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="95" fill="#1e1b4b" stroke="url(#gold-grad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Museum / Temple Column Crest inside Compass -->
  <path d="M190 320h132v12H190zm16-16h100v-8H206zm12-14h12v-58h-12zm32 0h12v-58h-12zm32 0h12v-58h-12zm-44-66l44-28 44 28H238z" fill="#fde047" opacity="0.95" />
  
  <!-- Compass Star / Poké-Quest Pin -->
  <path d="M256 120 L272 205 L350 205 L288 245 L310 320 L256 275 L202 320 L224 245 L162 205 L240 205 Z" fill="url(#coral-grad)" opacity="0.85" />
  <circle cx="256" cy="235" r="28" fill="#ffffff" stroke="#f43f5e" stroke-width="6" />
  <circle cx="256" cy="235" r="12" fill="#0f172a" />
</svg>
