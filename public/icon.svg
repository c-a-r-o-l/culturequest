<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cantabrigia-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C3A27" />
      <stop offset="100%" stop-color="#0F2015" />
    </linearGradient>
    <linearGradient id="brass-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CA8E" />
      <stop offset="50%" stop-color="#B89758" />
      <stop offset="100%" stop-color="#8C6E30" />
    </linearGradient>
    <linearGradient id="oxblood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E232B" />
      <stop offset="100%" stop-color="#541419" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Green Base Shield -->
  <rect width="512" height="512" rx="112" fill="url(#cantabrigia-green)" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#brass-gold)" stroke-width="3" stroke-opacity="0.6" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#B89758" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Collegiate Heraldic Shield -->
  <path d="M166 140 H346 V270 C346 345 256 395 256 395 C256 395 166 345 166 270 Z" fill="url(#oxblood)" stroke="url(#brass-gold)" stroke-width="8" filter="url(#gold-glow)"/>
  
  <!-- Open Manuscript Book (Upper Section) -->
  <path d="M210 200 C232 195 256 206 256 206 C256 206 280 195 302 200 V255 C280 250 256 261 256 261 C256 261 232 250 210 255 Z" fill="#FDF5E6" stroke="#B89758" stroke-width="3" />
  <path d="M256 206 V261" stroke="#8C6E30" stroke-width="2.5" />
  <!-- Manuscript Text Lines -->
  <line x1="220" y1="216" x2="246" y2="216" stroke="#8C6E30" stroke-width="2" opacity="0.6" />
  <line x1="220" y1="226" x2="246" y2="226" stroke="#8C6E30" stroke-width="2" opacity="0.6" />
  <line x1="220" y1="236" x2="242" y2="236" stroke="#8C6E30" stroke-width="2" opacity="0.6" />
  <line x1="266" y1="216" x2="292" y2="216" stroke="#8C6E30" stroke-width="2" opacity="0.6" />
  <line x1="266" y1="226" x2="292" y2="226" stroke="#8C6E30" stroke-width="2" opacity="0.6" />
  <line x1="266" y1="236" x2="288" y2="236" stroke="#8C6E30" stroke-width="2" opacity="0.6" />
  
  <!-- Cambridge Bridge / Stone Arch (Lower Section) -->
  <path d="M190 310 H322 V332 H190 Z" fill="#B89758" />
  <path d="M210 332 C210 295 240 285 256 285 C272 285 302 295 302 332 Z" fill="#1C3A27" stroke="#B89758" stroke-width="3" />
  <circle cx="256" cy="308" r="6" fill="#B89758" />
</svg>
